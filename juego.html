</div>

<div class="panel">

⏳ Tiempo
<span id="tiempo">45</span>
</div>

<div class="caja">
⭐ Puntos
<span id="puntos">0</span>
</div>

<div class="caja">
❌ Errores
<span id="errores">0</span>/5
</div>

<div class="caja">
⚡ Nivel
<span id="nivel">1</span>
</div>

</div>

🎯 <span id="objetivoTexto"></span>
</div>

<button id="startBtn">

</button>

REINICIAR
</button>

</div>

<img class="topo" src="DANIELPINTADO.jpeg">
</div>

</div>

<img class="topo" src="mauricio.jpeg">
</div>

<div class="agujero">
<img class="topo" src="mike2.jpg">
</div>

<div class="agujero">
<img class="topo" src="david.jpeg">
</div>

<div class="agujero">
<img class="topo" src="nathaly2.png">
</div>

</div>

<!-- ===== MODAL ===== -->

<div class="modal" id="modal">

<div class="modal-box">

<h2 id="modalTitulo"></h2>

<p id="modalTexto"></p>

<div id="modalBotones"></div>

</div>

</div>

<!-- ===== SONIDOS GAMER ===== -->

<audio
id="hitSound"
src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3">
</audio>

<audio
id="errorSound"
src="https://assets.mixkit.co/active_storage/sfx/2954/2954-preview.mp3">
</audio>

<audio
id="levelSound"
src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3">
</audio>

<script>

/* ===== SONIDOS ===== */

const hitSound = document.getElementById("hitSound");

const errorSound = document.getElementById("errorSound");

const levelSound = document.getElementById("levelSound");

hitSound.volume = 0.4;

errorSound.volume = 0.45;

levelSound.volume = 0.7;

/* ===== ELEMENTOS ===== */

const topos = document.querySelectorAll(".topo");

const agujeros = document.querySelectorAll(".agujero");

const puntosTexto = document.getElementById("puntos");

const tiempoTexto = document.getElementById("tiempo");

const erroresTexto = document.getElementById("errores");

const nivelTexto = document.getElementById("nivel");

const barra = document.getElementById("barra");

const objetivoTexto = document.getElementById("objetivoTexto");

const modal = document.getElementById("modal");

const modalTitulo = document.getElementById("modalTitulo");

const modalTexto = document.getElementById("modalTexto");

const modalBotones = document.getElementById("modalBotones");

/* ===== VARIABLES ===== */

let puntos = 0;

let errores = 0;

let tiempo = 45;

let nivel = 1;

let juegoActivo = false;

let intervaloTiempo;

let velocidad = 2000;

let ultimo = null;

/* ===== OBJETIVOS ===== */

const objetivos = {

1: 2,

2: 4,

3: 6,

4: 8

};

/* ===== DIFICULTAD ===== */

function actualizarDificultad(){

if(nivel === 1) velocidad = 2100;

if(nivel === 2) velocidad = 1600;

if(nivel === 3) velocidad = 1000;

if(nivel === 4) velocidad = 750;

}

/* ===== UI ===== */

function actualizarUI(){

puntosTexto.textContent = puntos;

erroresTexto.textContent = errores;

tiempoTexto.textContent = tiempo;

nivelTexto.textContent = nivel;

objetivoTexto.textContent =
`${objetivos[nivel]} puntos para pasar`;

barra.style.width =
(puntos / objetivos[nivel]) * 100 + "%";

}

/* ===== RANDOM ===== */

function randomAgujero(){

let a;

do{

a = agujeros[Math.floor(Math.random() * agujeros.length)];

}while(a === ultimo);

ultimo = a;

return a;

}

/* ===== ERRORES ===== */

function sumarError(){

errores++;

erroresTexto.textContent = errores;

errorSound.currentTime = 0;

errorSound.play().catch(()=>{});

if(errores >= 5){

terminarJuego(false);

}

}

/* ===== MOSTRAR TOPO ===== */

function mostrarTopo(){

if(!juegoActivo) return;

/* ocultar todos */
topos.forEach(t => {

t.classList.remove("visible");

t.dataset.clicked = "false";

});

/* elegir topo */
const topo = randomAgujero().querySelector(".topo");

topo.classList.add("visible");

/* tiempo original */
let tiempoVisible = velocidad * (0.4 + Math.random());

setTimeout(() => {

/* si NO lo aplastaron */
if(

topo.classList.contains("visible") &&

topo.dataset.clicked !== "true"

){

topo.classList.remove("visible");

sumarError();

}

/* continuar */
if(juegoActivo){

setTimeout(mostrarTopo, 80 + Math.random()*120);

}

}, tiempoVisible);

}

/* ===== CLICK ===== */

topos.forEach(topo => {

topo.addEventListener("click", () => {

if(!juegoActivo) return;

if(!topo.classList.contains("visible")) return;

/* evitar bug */
if(topo.dataset.clicked === "true") return;

topo.dataset.clicked = "true";

topo.classList.remove("visible");

puntos++;

puntosTexto.textContent = puntos;

/* sonido hit */
hitSound.currentTime = 0;

hitSound.play().catch(()=>{});

actualizarUI();

if(puntos >= objetivos[nivel]){

if(nivel < 4){

pasarNivel();

}else{

terminarJuego(true);

}

}

});

});

/* ===== PASAR NIVEL ===== */

function pasarNivel(){

juegoActivo = false;

clearInterval(intervaloTiempo);

levelSound.currentTime = 0;

levelSound.play().catch(()=>{});

modal.style.display = "flex";

modalTitulo.textContent =
`Nivel ${nivel} completado`;

modalTexto.textContent =
"La dificultad aumenta 🔥";

modalBotones.innerHTML =

`<button class="btn-next"
onclick="continuarNivel()">
SIGUIENTE NIVEL
</button>`;

}

/* ===== CONTINUAR ===== */

function continuarNivel(){

modal.style.display = "none";

nivel++;

puntos = 0;

tiempo = 45;

actualizarDificultad();

actualizarUI();

juegoActivo = true;

mostrarTopo();

intervaloTiempo = setInterval(() => {

tiempo--;

tiempoTexto.textContent = tiempo;

if(tiempo <= 0){

terminarJuego(false);

}

}, 1000);

}

/* ===== INICIAR ===== */

function iniciar(){

clearInterval(intervaloTiempo);

modal.style.display = "none";

puntos = 0;

errores = 0;

tiempo = 45;

nivel = 1;

actualizarDificultad();

actualizarUI();

juegoActivo = true;

mostrarTopo();

intervaloTiempo = setInterval(() => {

tiempo--;

tiempoTexto.textContent = tiempo;

if(tiempo <= 0){

terminarJuego(false);

}

}, 1000);

}

/* ===== TERMINAR ===== */

function terminarJuego(gano){

juegoActivo = false;

clearInterval(intervaloTiempo);

modal.style.display = "flex";

modalTitulo.textContent =
gano ? "🏆 GANASTE" : "💀 PERDISTE";

modalTexto.textContent =
gano
? "Excelente partida"
: "Sigue intentando";

modalBotones.innerHTML =

`<button class="btn-restart"
onclick="iniciar()">
REINICIAR
</button>`;

}

/* ===== BOTONES ===== */

document.getElementById("startBtn").onclick = iniciar;

document.getElementById("restartBtn").onclick = iniciar;

</script>

</body>
