<main class="content">

<div>

</div>
</div>

<div class="quiz-container">

<div class="quiz-info">
<div class="info-card">⏱ <span id="timer">12</span>s</div>
<div class="info-card">❤️ <span id="errors">0</span>/5</div>
<div class="info-card">⭐ <span id="score">0</span></div>
</div>

<div class="progress">
<div class="progress-bar" id="progress-bar"></div>
</div>

<div class="question-number" id="question-number"></div>
<div class="question" id="question"></div>

<div class="answers" id="answers"></div>

<div class="quiz-footer">
<button id="next-btn">Siguiente ➜</button>
<button id="restart-btn">Reiniciar 🔄</button>
</div>

</div>

<div class="result-box" id="result-box">
<h2>🎉 ¡Quiz terminado!</h2>
<div class="score-final" id="final-score">0</div>

</div>

<footer>
© 2026 - David Lazo - Sadma Lazo - Guissella Suqui
</footer>

</main>
</div>

<script>

const sonidoCorrecto = new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_5b6d7c8a1f.mp3");
const sonidoError = new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_3d5f1c0f1b.mp3");

const preguntas = [
{pregunta:"¿Qué deporte practica Daniel Pintado?",opciones:["Fútbol","Marcha Atlética","Taekwondo","Natación"],correcta:"Marcha Atlética"},
{pregunta:"¿Qué deporte practica Renata Matute?",opciones:["Karate","Judo","Jujitsu","Lucha Olímpica"],correcta:"Jujitsu"},
{pregunta:"¿Qué deportista ganó oro en París 2024?",opciones:["Daniel Pintado","Mike Erraez","Renata Matute","Kevin Erraez"],correcta:"Daniel Pintado"},
{pregunta:"¿Qué deporte practica Nathaly León?",opciones:["Marcha Atlética","Fútbol","Tenis","Natación"],correcta:"Marcha Atlética"},
{pregunta:"¿Quién es de Machala?",opciones:["David Lazo","Daniel Pintado","Mike Erraez","Renata Matute"],correcta:"David Lazo"},
{pregunta:"¿Qué color domina la interfaz?",opciones:["Azul","Rojo","Verde","Morado"],correcta:"Azul"},
{pregunta:"¿Qué país representan los deportistas?",opciones:["Perú","Chile","Ecuador","Colombia"],correcta:"Ecuador"},
{pregunta:"¿Qué deporte practica Mike Erraez?",opciones:["Taekwondo","Lucha Olímpica","Jujitsu","Atletismo"],correcta:"Lucha Olímpica"},
{pregunta:"¿Qué competencia ganó Daniel Pintado en Lima 2019?",opciones:["Panamericanos","Mundial","Sudamericanos","Olimpiadas"],correcta:"Panamericanos"},
{pregunta:"¿Cuántos errores máximos tiene el quiz?",opciones:["3","4","5","10"],correcta:"5"},
{pregunta:"¿Quién obtuvo oro en Copa Morlako?",opciones:["Renata Matute","Mike Erraez","Kevin Erraez","David Lazo"],correcta:"Renata Matute"},
{pregunta:"¿Qué institución aparece en la página?",opciones:["UNEDID","Salesianos","Borja","La Salle"],correcta:"UNEDID"},
{pregunta:"¿Qué deporte practica David Lazo?",opciones:["Taekwondo","Atletismo","Fútbol","Jujitsu"],correcta:"Taekwondo"},
{pregunta:"¿Quién obtuvo plata en Budapest 2023?",opciones:["Daniel Pintado","Mike Erraez","David Lazo","Kevin Erraez"],correcta:"Daniel Pintado"},
{pregunta:"¿Quién ganó oro en Intercolegiales?",opciones:["Mike Erraez","Daniel Pintado","David Lazo","Nathaly León"],correcta:"Mike Erraez"},
{pregunta:"¿Quién obtuvo plata en Slow Flow?",opciones:["Renata Matute","Nathaly León","Mike Erraez","Juan Pablo Molina"],correcta:"Renata Matute"},
{pregunta:"¿Quién obtuvo oro en SNOBUDO 2024?",opciones:["David Lazo","Mike Erraez","Kevin Erraez","Daniel Pintado"],correcta:"David Lazo"},
{pregunta:"¿Qué deportista es entrenador de atletismo?",opciones:["Juan Pablo Molina","Daniel Pintado","Kevin Erraez","Nathaly León"],correcta:"Juan Pablo Molina"},
{pregunta:"¿Quién ganó bronce en maratón marcha?",opciones:["Nathaly León","Daniel Pintado","Renata Matute","Mike Erraez"],correcta:"Nathaly León"}
];

let i=0, score=0, errors=0, time=12, timer;
let locked=false;

const q=document.getElementById("question");
const a=document.getElementById("answers");
const t=document.getElementById("timer");
const e=document.getElementById("errors");
const s=document.getElementById("score");
const bar=document.getElementById("progress-bar");

function load(){

clearInterval(timer);
locked=false;
time=12;
t.textContent=time;

if(i>=preguntas.length){
end();
return;
}

let p=preguntas[i];

document.getElementById("question-number").textContent=
`Pregunta ${i+1} de ${preguntas.length}`;

q.textContent=p.pregunta;
a.innerHTML="";

bar.style.width=((i+1)/preguntas.length)*100+"%";

p.opciones.sort(()=>Math.random()-0.5);

p.opciones.forEach(op=>{
let b=document.createElement("button");
b.className="answer";
b.textContent=op;
b.dataset.value=op;
b.style.touchAction="manipulation";
b.onclick=()=>check(b);
a.appendChild(b);
});

start();
}

function check(btn){

if(locked) return;
locked=true;

clearInterval(timer);

let correct=preguntas[i].correcta;

document.querySelectorAll(".answer").forEach(b=>{
b.disabled=true;
if(b.dataset.value===correct){
b.classList.add("correct");
}
});

if(btn.dataset.value===correct){
sonidoCorrecto.play().catch(()=>{});
score+=10;
s.textContent=score;
}else{
sonidoError.play().catch(()=>{});
btn.classList.add("wrong");
errors++;
e.textContent=errors;
}
}

document.getElementById("next-btn").onclick=()=>{
i++;
load();
};

document.getElementById("restart-btn").onclick=()=>location.reload();

function end(){
clearInterval(timer);
document.querySelector(".quiz-container").style.display="none";
document.getElementById("result-box").style.display="block";
document.getElementById("final-score").textContent=score+" pts";
}

function start(){
timer=setInterval(()=>{
time--;
t.textContent=time;
if(time<=0){
errors++;
e.textContent=errors;
i++;
load();
}
},1000);
}

load();

</script>

</body>
</html>
